<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Craft - Indigenous Crafts</title>
</head>

<body>

    <h1>Create Craft</h1>

    <form method="POST">

        <label for="name">Craft Name:</label>
        <input
            type="text"
            id="name"
            name="name"
            required
        >

        <br><br>

        <label for="craft_type">Craft Type:</label>
        <input
            type="text"
            id="craft_type"
            name="craft_type"
            required
        >

        <br><br>

        <label for="location">Location:</label>
        <input
            type="text"
            id="location"
            name="location"
            required
        >

        <br><br>

        <label for="description">Description:</label>
        <textarea
            id="description"
            name="description"
        ></textarea>

        <br><br>

        <label for="material">Material:</label>
        <input
            type="text"
            id="material"
            name="material"
        >

        <br><br>

        <label for="production_method">Production Method:</label>
        <textarea
            id="production_method"
            name="production_method"
        ></textarea>

        <br><br>

        <label for="story">Story / Background:</label>
        <textarea
            id="story"
            name="story"
        ></textarea>

        <br><br>

        <label for="cultural_information">Cultural Information:</label>
        <textarea
            id="cultural_information"
            name="cultural_information"
        ></textarea>

        <br><br>

        <label for="pattern">Pattern:</label>
        <input
            type="text"
            id="pattern"
            name="pattern"
        >

        <br><br>

        <button type="submit">Create Craft</button>

    </form>

</body>
</html>
